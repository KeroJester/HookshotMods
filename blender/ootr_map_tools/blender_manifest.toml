schema_version = "1.0.0"

id = "ootr_map_tools"
version = "0.8.3"
name = "OoT Remake Map Tools"
tagline = "Load Ocarina of Time remake maps into Blender"
maintainer = "KeroJester"
type = "add-on"
website = "https://github.com/KeroJester/HookshotMods"
tags = ["Import-Export", "Game Engine"]

blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]

platforms = ["linux-x64", "windows-x64"]
wheels = [
  "./wheels/texture2ddecoder-1.0.6-cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/texture2ddecoder-1.0.6-cp311-abi3-win_amd64.whl",
]

# reads the user's own game folder (chosen in the preferences); writes only where the user exports
[permissions]
files = "Read the game folder and the texture cache; write exported maps"
